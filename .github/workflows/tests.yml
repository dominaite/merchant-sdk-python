name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest interpreter pyproject claims support for, and the one the publish
        # workflow builds with. A break on either end shows up here and not on a tag.
        python-version: ["3.9", "3.12"]
    name: pytest (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the suite
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    name: lint (ruff, mypy)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the dev extra
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      # mypy 2 cannot target 3.9, so it checks src against 3.12. The pytest job on 3.9
      # still catches syntax that is too new for the floor.
      - name: mypy
        run: mypy src
