name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest interpreter pyproject claims support for, and the one the publish
        # workflow builds with. A break on either end shows up here and not on a tag.
        python-version: ["3.9", "3.12"]
    name: pytest (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the suite
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    name: lint (ruff, mypy)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the dev extra
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      # mypy 2 cannot target 3.9, so it checks src against 3.12. The pytest job on 3.9
      # still catches syntax that is too new for the floor.
      - name: mypy
        run: mypy src
