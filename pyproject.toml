[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI name settled as "dominaite" (verified free 2026-08-17); matches the import name.
name = "dominaite"
version = "0.6.0"
description = "Server-side Python client for the Dominaite merchant API: create hosted checkout sessions from your own backend."
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.optional-dependencies]
# mypy 2 needs Python 3.10 or later, so a 3.9 dev install skips it.
dev = ["pytest>=7.0", "ruff==0.17.1", "mypy==2.4.0; python_version >= '3.10'"]

[tool.hatch.build.targets.wheel]
packages = ["src/dominaite"]
# PEP 561 marker. Named explicitly rather than left to the default file walk: without it
# inside the wheel, mypy and pyright ignore every annotation in this package, and the
# failure is silent - consumers just get `Any` back and never learn why.
force-include = { "src/dominaite/py.typed" = "dominaite/py.typed" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The runtime floor. Rules that rewrite to newer syntax stay off.
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
