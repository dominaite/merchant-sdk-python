[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI name settled as "dominaite" (verified free 2026-08-17); matches the import name.
name = "dominaite"
version = "0.2.0"
description = "Server-side Python client for the Dominaite merchant API: create hosted checkout sessions from your own backend."
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dominaite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
